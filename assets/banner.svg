<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4361EE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glowing Elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes scanline {
        0% { transform: translateY(-400px); }
        100% { transform: translateY(400px); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .pulse-ring {
        transform-origin: 180px 200px;
        animation: pulse 4s infinite ease-in-out;
      }
      .shield-float {
        animation: float 6s infinite ease-in-out;
      }
      .radar-arm {
        transform-origin: 180px 200px;
        animation: radarSweep 8s linear infinite;
      }
      .scan-line {
        animation: scanline 5s linear infinite;
      }
      .text-title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .text-sub {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="0.8">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Animated Scanning Line -->
  <g class="scan-line">
    <rect x="0" y="0" width="1200" height="40" fill="url(#scanGrad)" />
  </g>

  <!-- Left Side: Cyber Shield & Radar Animation -->
  <g class="shield-float">
    <!-- Radar concentric circles -->
    <circle cx="180" cy="200" r="140" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.15" />
    <circle cx="180" cy="200" r="105" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.25" class="pulse-ring" />
    <circle cx="180" cy="200" r="70" fill="none" stroke="#4361EE" stroke-width="1" opacity="0.3" />

    <!-- Radar sweeping beam -->
    <g class="radar-arm">
      <path d="M180,200 L180,60 A140,140 0 0,1 280,100 Z" fill="url(#scanGrad)" opacity="0.4" />
    </g>

    <!-- Glowing Cyber Shield -->
    <path d="M 180,105 
             C 240,105 255,120 255,175 
             C 255,245 180,290 180,290 
             C 180,290 105,245 105,175 
             C 105,120 120,105 180,105 Z" 
          fill="url(#shieldGrad)" stroke="#00F0FF" stroke-width="3" filter="url(#glow)" />

    <!-- Lock / Human icon inside shield -->
    <g transform="translate(180, 195)" filter="url(#softGlow)">
      <!-- Cyber Lock Icon -->
      <rect x="-24" y="-10" width="48" height="38" rx="6" fill="#0B132B" stroke="#00F0FF" stroke-width="2.5" />
      <path d="M-14,-10 C-14,-26 14,-26 14,-10" fill="none" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="0" cy="6" r="5" fill="#00F0FF" />
      <path d="M0,8 L0,18" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Node network points -->
    <circle cx="90" cy="110" r="4" fill="#00F0FF" filter="url(#glow)" />
    <line x1="90" y1="110" x2="130" y2="135" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <circle cx="270" cy="110" r="4" fill="#FF007A" filter="url(#glow)" />
    <line x1="270" y1="110" x2="230" y2="135" stroke="#FF007A" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
    <circle cx="275" cy="275" r="4" fill="#7000FF" filter="url(#glow)" />
    <line x1="275" y1="275" x2="220" y2="255" stroke="#7000FF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
  </g>

  <!-- Right Side: Clean Typography & Info Badges -->
  <g transform="translate(360, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 70)">
      <rect width="360" height="32" rx="16" fill="#141E3C" stroke="#00F0FF" stroke-width="1.2" opacity="0.85" />
      <circle cx="16" cy="16" r="5" fill="#00F0FF" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#E2E8F0" font-size="12" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="1.5">
        HUMAN RISK MANAGEMENT &amp; TRAINING
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" fill="#FFFFFF" font-size="38" class="text-title" font-weight="900" filter="url(#softGlow)">
      Awesome Security Awareness
    </text>
    <text x="0" y="195" fill="url(#cyberCyan)" font-size="34" class="text-title" font-weight="900">
      Training &amp; Simulation Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" fill="#94A3B8" font-size="16" class="text-sub">
      Curated Ecosystem of Enterprise SaaS Platforms &amp; Open-Source Toolkits
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 275)">
      <!-- Tag 1: Phishing Simulation -->
      <g transform="translate(0, 0)">
        <rect width="185" height="36" rx="8" fill="#0E1A38" stroke="#38BDF8" stroke-width="1.2" />
        <text x="14" y="23" fill="#38BDF8" font-size="13" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600">🎯 Phishing Simulation</text>
      </g>

      <!-- Tag 2: Behavior & HRM -->
      <g transform="translate(195, 0)">
        <rect width="185" height="36" rx="8" fill="#1C1138" stroke="#C084FC" stroke-width="1.2" />
        <text x="14" y="23" fill="#C084FC" font-size="13" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600">🧠 Behavioral Analytics</text>
      </g>

      <!-- Tag 3: Compliance & SAT -->
      <g transform="translate(390, 0)">
        <rect width="195" height="36" rx="8" fill="#2A0F29" stroke="#F472B6" stroke-width="1.2" />
        <text x="14" y="23" fill="#F472B6" font-size="13" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600">🛡️ Compliance &amp; Micro-LMS</text>
      </g>
    </g>

    <!-- Footer Stats / Meta -->
    <g transform="translate(0, 345)">
      <text x="0" y="0" fill="#64748B" font-size="13" font-family="'Segoe UI', Roboto, sans-serif">
        ⚡ Updated for 2026 • Verified SaaS Pricing • Open-Source Star Rankings
      </text>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect width="1200" height="400" rx="16" fill="none" stroke="url(#cyberCyan)" stroke-width="2" opacity="0.6" />
</svg>
